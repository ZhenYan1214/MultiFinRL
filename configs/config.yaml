# 全域參數，三個模組共同讀取；改動需通知全員
market: US
tickers: [AAPL, NVDA, MSFT] # 多股票擴充實驗（決議見 docs/decisions.md），AAPL 仍是預設單股 ticker
date_range:
  start: "2021-01-01"
  end: "2026-08-09"        # 2026-08 延伸，對齊新聞回補範圍（decisions.md #29）

market_data:
  # 調整拆股與現金股利，讓 label / PPO reward / backtest 使用可投資的 total-return 近似，
  # 避免把除權息機械性價格跳空誤認成模型應預測的跌幅。
  auto_adjust: true

chart:
  window_days: 20
  image_size: [224, 224]
  channels: 3
  format: png
  # ViT 依序讀入兩張圖。第二項日後可換成 technical/<indicator_set>，
  # 只要 build_dataset 寫出的 chart.inputs 路徑與此順序一致即可。
  vision_inputs: [candlestick, volume]

label:
  horizon_trading_days: 5   # 未來第 5 個交易日收盤 vs 當日收盤
  # 2026-08 起改用分位數門檻（decisions.md #30，取代原本固定 ±2%，見 #16）：
  # 只依 train 期間報酬分布取 1/3、2/3 分位數，再固定套用 validation/test。
  quantile_low: 0.3333       # 最低 1/3 -> BEARISH
  quantile_high: 0.6667      # 最高 1/3 -> BULLISH，中間 1/3 -> NEUTRAL
  # 舊版固定門檻（保留參考、供 ablation 對照用，見 labeling.py 的 make_label_fixed_threshold）：
  # bullish_threshold: 0.02   # > +2% -> BULLISH
  # bearish_threshold: -0.02  # < -2% -> BEARISH，其餘 NEUTRAL

# 所有訓練、診斷與回測共用同一份時間序切分。使用未來報酬的樣本若跨越區段邊界，
# 會標成 purged，不進入任一模型的 train/validation/test。
evaluation:
  train_ratio: 0.70
  validation_ratio: 0.15
  backtest_split: test

text:
  max_chunk_tokens: 512     # FinBERT 上限

rag:
  top_k: 3
  vector_db: faiss          # faiss 或 milvus
  query_alpha: 0.5          # RAG query 合併權重（H_v 的權重，1-alpha 為 H_t），見 retriever.py

# encoder 預設（B 模組讀取；shape 一旦定案不可再變，見 docs/data_format.md）
encoders:
  vision: google/vit-base-patch16-224   # H_v: [2, 197, 768]（圖別, token, hidden）
  text: ProsusAI/finbert                # H_t: [512, 768]；H_r: [3, 512, 768]

# fusion / RL（C 模組讀取）
fusion:
  d_model: 768              # 融合層內部維度
  n_heads: 8
  n_layers: 2
  z_dim: 768                # Z_fused 輸出維度

timezone: America/New_York
seed: 42
