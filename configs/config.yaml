# 全域參數，三個模組共同讀取；改動需通知全員
market: US
tickers: [AAPL, NVDA, MSFT] # 多股票擴充實驗（決議見 docs/decisions.md），AAPL 仍是預設單股 ticker
date_range:
  start: "2021-01-01"
  end: "2026-08-09"        # 2026-08 延伸，對齊新聞回補範圍（decisions.md #29）

chart:
  window_days: 20
  image_size: [224, 224]
  channels: 3
  format: png
  # ViT 依序讀入兩張圖。第二項日後可換成 technical/<indicator_set>，
  # 只要 build_dataset 寫出的 chart.inputs 路徑與此順序一致即可。
  vision_inputs: [candlestick, volume]

# ETF／指數使用 `run_pipeline.py --macro` 時的視覺輸入：K 線＋FOMC SEP 點陣圖。
# FRED 指標與 FOMC 新聞另外走 H_t/H_r；雙圖 shape 契約維持不變。
macro:
  vision_inputs: [candlestick, macro_dot_plot]
  news_backfill_days: 7

label:
  horizon_trading_days: 5   # 未來第 5 個交易日收盤 vs 當日收盤
  # 2026-08 起改用分位數門檻（decisions.md #30，取代原本固定 ±2%，見 #16）：
  # 只依 Train 期間報酬分布取 1/3、2/3 分位數，再固定套用到 Validation/Test。
  quantile_low: 0.3333       # 最低 1/3 -> BEARISH
  quantile_high: 0.6667      # 最高 1/3 -> BULLISH，中間 1/3 -> NEUTRAL
  # 舊版固定門檻（保留參考、供 ablation 對照用，見 labeling.py 的 make_label_fixed_threshold）：
  # bullish_threshold: 0.02   # > +2% -> BULLISH
  # bearish_threshold: -0.02  # < -2% -> BEARISH，其餘 NEUTRAL

# A/B/C 共用的唯一時間切分。gap 預設等於 5 日標籤 horizon，避免邊界標籤跨區間。
temporal_split:
  train_ratio: 0.70
  validation_ratio: 0.15
  gap_trading_days: 5

text:
  max_chunk_tokens: 512     # FinBERT 上限

# ---- 架構見 docs/architecture/architecture.html，decisions.md #108–#131 ----
# K 線文字敘述：Claude Haiku 讀 K 線圖＋成交量圖（module_a_data/chart_caption.py）
caption:
  model: claude-haiku-5-5
  effort: null              # null = 模型預設；可改 low/medium/high

# RAG-1：7 類型態定義（data/knowledge/patterns/*.md），檢索結果 H_r 進融合層
rag1:
  top_k: 3                  # 每天從 7 段定義取前 K 段；7 = 全部放進融合層
  # query = K 線圖的池化向量（P_v 投影後），key = 定義的池化向量（P_t 投影後），
  # 在 L_align 對齊過的共用空間算 cosine；見 fusion/model.py 的 retrieve()
  retrieve_warmup_epochs: 1 # 前 N 個 epoch 共用空間還沒對齊，先用全部 7 段（K=7）

# RAG-2：Decoder 生成前篩選當天候選（module_b_encoder/rag/rag2.py）
rag2:
  max_snippets: 20          # 15–20 段
  snippet_words: 40         # 每段短版約前 40 個英文字
  background_sections: [mda, risk_factors]   # 背景 10-K／10-Q 固定挑的章節
  transcript_snippets: 4    # 最近一場法說會挑幾段

# encoder 預設（B 模組讀取；shape 一旦定案不可再變，見 docs/data_format.md）
encoders:
  vision: google/vit-base-patch16-224   # H_v: [2, 197, 768]（圖別, token, hidden）
  text: ProsusAI/finbert                # H_t（K 線敘述）: [512, 768]；RAG-1 定義: [9, 512, 768]

# 融合層（C 模組讀取）
fusion:
  d_model: 768              # 融合層內部維度
  n_heads: 8
  n_layers: 2
  z_dim: 768                # Z_fused 輸出維度
  max_caption_tokens: 192   # H_t 只取 K 線敘述實際的 token（敘述約 80–150 token）

# 三個 Loss（計畫書 3.5，公式不動）：L = λ1·L_align + λ2·L_ground + λ3·L_belief
loss:
  lambda_align: 1.0
  lambda_ground: 1.0
  lambda_belief: 1.0
  align_tau: 0.07           # L_align 溫度 τ
  alpha_star_space: label   # α*：label＝敘述的型態標籤（#131，Q13 定案）；frozen／projected 是 cosine 版本，只當對照
  ground_smoothing: 0.1     # label 版 α*：正確那段 1−ε，其他段平分 ε
  ground_tau: 0.01          # 只有 frozen／projected 用：α* = softmax(cos / τ)

timezone: America/New_York
seed: 42
